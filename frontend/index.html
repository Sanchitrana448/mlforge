<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MLForge Monitoring</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{--bg:#0b0f19;--panel:#121826;--border:#243044;--text:#e6ebf5;--muted:#8b98b0;--accent:#3ddc97;--warn:#f5a623;--bad:#ff6b6b;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  header{padding:24px 32px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  header h1{margin:0;font-size:20px;} header p{margin:4px 0 0;color:var(--muted);font-size:13px;}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 32px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
  .card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .card .value{font-size:26px;font-weight:700;margin-top:6px;color:var(--accent)}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px;}
  .panel h2{margin:0 0 12px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:8px;border-bottom:1px solid var(--border);text-align:left}
  button{background:var(--accent);color:#062018;border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600}
  .drifted{color:var(--bad);font-weight:700}
  .ok{color:var(--accent)}
</style>
</head>
<body>
<header>
  <div><h1>⚙ MLForge</h1><p>Production ML monitoring — model performance, live predictions, feature drift.</p></div>
  <button onclick="simulate()">Simulate 20 predictions</button>
</header>
<div class="wrap">
  <div class="grid" id="statCards"></div>

  <div class="panel">
    <h2>Model</h2>
    <div id="modelInfo"></div>
  </div>

  <div class="panel">
    <h2>Feature drift</h2>
    <table id="driftTable"><thead><tr><th>Feature</th><th>Training mean</th><th>Live mean</th><th>Z-shift</th><th>Status</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="panel">
    <h2>Recent predictions</h2>
    <table id="predTable"><thead><tr><th>Request</th><th>Prediction</th><th>Probability</th><th>Model</th></tr></thead><tbody></tbody></table>
  </div>
</div>
<script>
async function refresh(){
  const [metrics, drift, recent] = await Promise.all([
    fetch('/metrics').then(r=>r.json()),
    fetch('/drift').then(r=>r.json()),
    fetch('/predictions/recent?limit=15').then(r=>r.json()),
  ]);
  document.getElementById('statCards').innerHTML = `
    <div class="card"><div class="label">Model version</div><div class="value" style="font-size:16px">${metrics.model_version}</div></div>
    <div class="card"><div class="label">ROC-AUC (val)</div><div class="value">${metrics.validation_metrics.roc_auc}</div></div>
    <div class="card"><div class="label">F1 (test)</div><div class="value">${metrics.test_metrics.f1}</div></div>
    <div class="card"><div class="label">Predictions served</div><div class="value">${metrics.predictions_served}</div></div>
    <div class="card"><div class="label">Live churn rate</div><div class="value">${metrics.live_predicted_churn_rate ?? '—'}</div></div>`;

  document.getElementById('modelInfo').innerHTML = `
    <p><b>Selected model:</b> ${metrics.model_version}</p>
    <p><b>Validation:</b> acc ${metrics.validation_metrics.accuracy} · precision ${metrics.validation_metrics.precision} · recall ${metrics.validation_metrics.recall} · f1 ${metrics.validation_metrics.f1} · roc-auc ${metrics.validation_metrics.roc_auc}</p>
    <p><b>Held-out test:</b> acc ${metrics.test_metrics.accuracy} · precision ${metrics.test_metrics.precision} · recall ${metrics.test_metrics.recall} · f1 ${metrics.test_metrics.f1} · roc-auc ${metrics.test_metrics.roc_auc}</p>`;

  document.querySelector('#driftTable tbody').innerHTML = drift.features.map(f=>`
    <tr><td>${f.feature}</td><td>${f.training_mean}</td><td>${f.live_mean}</td><td>${f.z_shift}</td>
    <td class="${f.drifted?'drifted':'ok'}">${f.drifted?'⚠ DRIFT':'✓ stable'}</td></tr>`).join('') || '<tr><td colspan=5>No live traffic yet.</td></tr>';

  document.querySelector('#predTable tbody').innerHTML = recent.map(p=>`
    <tr><td>${p.request_id}</td><td>${p.prediction}</td><td>${p.probability}</td><td>${p.model_version}</td></tr>`).join('') || '<tr><td colspan=4>No predictions yet.</td></tr>';
}
async function simulate(){
  for(let i=0;i<20;i++){
    const req = {
      tenure_months: Math.random()*72,
      monthly_charge: 40+Math.random()*140,
      total_charge: 500+Math.random()*4000,
      num_support_tickets: Math.floor(Math.random()*5),
      contract_type: Math.floor(Math.random()*3),
      has_internet_addon: Math.random()>0.3?1:0,
      avg_monthly_usage_gb: Math.random()*350,
      late_payments_last_year: Math.floor(Math.random()*3),
    };
    await fetch('/predict', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(req)});
  }
  refresh();
}
refresh();
setInterval(refresh, 8000);
</script>
</body>
</html>
